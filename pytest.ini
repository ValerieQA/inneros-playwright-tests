[pytest]
testpaths = tests
pythonpath = .
base_url = https://www.inneros.online
addopts =
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
markers =
    smoke: быстрые проверки живого сайта InnerOS (запуск: pytest -m smoke)
    practice: учебные тесты на локальной странице (запуск: pytest -m practice)
