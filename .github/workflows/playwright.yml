name: Playwright Tests

on:
  push:
    branches: [main, ecommerce-framework]
  pull_request:
    branches: [main, ecommerce-framework]
  workflow_dispatch:

jobs:
  test:
    name: Login, cart, checkout (Chromium + Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # "--update-snapshots=missing": compare against committed baselines, but if a
      # baseline doesn't exist yet (very first run) record it instead of failing.
      - name: Run Playwright tests
        run: npx playwright test --update-snapshots=missing

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and videos of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
