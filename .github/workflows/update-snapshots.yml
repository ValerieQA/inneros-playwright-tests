# Records visual baselines in the same Linux environment the tests run in,
# and commits them to the repository.
# Runs when the visual tests (or this workflow) change on the ecommerce-framework branch,
# or manually: Actions → "Update visual baselines" → Run workflow. Manual runs need this file
# on the default branch too, which is why the push trigger exists for this branch.
# The bot's commit uses GITHUB_TOKEN, so it does not re-trigger any workflow (no loops).
name: Update visual baselines

on:
  push:
    branches: [ecommerce-framework]
    paths:
      - 'tests/visual/*.ts'
      - '.github/workflows/update-snapshots.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record baselines
        run: npx playwright test tests/visual --project=chromium --update-snapshots=all
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git diff --cached --quiet && echo "Baselines unchanged" || (git commit -m "Update visual baselines" && git push)
